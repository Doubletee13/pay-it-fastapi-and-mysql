version: "3.9"

services:
  payit.api:
    build: .
    container_name: payit.api
    ports:
      - "8000:8000"
    env_file:
      - .env

    volumes:
      - ./app:/app/app
    depends_on:
      payit_app_db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
  payit_app_db:
    image: mysql:8.0
    container_name: payit_db
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
    ports:
      - "3308:3306"
    volumes:
      - payit_db_data:/var/lib/mysql
    restart: unless-stopped
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --innodb_buffer_pool_size=256M
      - --innodb_log_file_size=128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  payit_db_data: